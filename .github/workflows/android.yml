name: Android

# Kiểm android/ trên runner Linux theo mỗi PR chạm android/ hoặc oracle dùng chung (Nt0 chốt Q8 2026-10-22,
# docs/product/plan-android-v1.md Phần 4). Check `android` xanh trên SHA cuối là bằng chứng merge cho phần lint + test;
# PR chạm android/app/** và các cổng cần thêm status `local/verify-android` (emulator trên Mac,
# android/scripts/check_android.sh --ui). Không đổi workflow `CI` của macOS (chỉ chạy tay, tag `v*`).
# Tag phát hành Android là `android-v*`, không khớp `v*` của macOS. A4 thêm job đóng APK ký khi gắn tag.
on:
  pull_request:
    paths:
      - "android/**"
      - "fixtures/**"
      - "schema/**"
      - "Packages/SharedFeatures/Sources/LibraryData/Resources/Samples/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  push:
    tags: ["android-v*"]

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Luật riêng, lint, test, so ảnh screenshot
        run: android/scripts/check_android.sh
      - name: Báo cáo khi thất bại
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/*/build/reports/
            android/*/build/outputs/
          retention-days: 7
